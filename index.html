<script>

/* BACKEND */

const BACKEND =
"https://script.google.com/a/macros/jalsd.org/s/AKfycbzHeApHApkpHw_RS79RBNt7acMfUR6pkvKWC9fY5B6lX4wImNOqlee3HXNDya5Rxv6prg/exec";


/* AUTHORIZED TEST SITE */

// All websites are now allowed.


/* OVERLAY SYSTEM */

const defaultOverlay = document.getElementById("defaultOverlay");

let nebulaVisible = false;

function showNebula() {
    nebulaVisible = true;
    defaultOverlay.classList.add("hidden");
}

function showDefaultOverlay() {
    nebulaVisible = false;
    defaultOverlay.classList.remove("hidden");
}

/* CTRL + Q TOGGLE */

document.addEventListener("keydown", function(event) {

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "q" &&
        !event.altKey &&
        !event.metaKey
    ) {

        event.preventDefault();
        event.stopPropagation();

        if (nebulaVisible) {
            showDefaultOverlay();
        } else {
            showNebula();
        }
    }

});

/* RETURN TO OVERLAY WHEN LEAVING NEBULA TAB */

document.addEventListener("visibilitychange", function() {

    if (document.hidden) {
        showDefaultOverlay();
    }

});

/* ALSO HANDLE WINDOW FOCUS CHANGES */

window.addEventListener("blur", function() {
    // Delay slightly to see where the focus actually landed
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === "IFRAME") {
            // If focus moved to an internal iframe, do not trigger the overlay
            return;
        }
        showDefaultOverlay();
    }, 100);
});



/* TAB SYSTEM */

let tabs = [];
let activeTabId = null;
let nextTabId = 1;

function getActiveTab() {
    return tabs.find(tab => tab.id === activeTabId);
}

function createTab() {
    const id = nextTabId++;

    const frame = document.createElement("iframe");
    frame.className = "viewer";

    /*
       LINK NAVIGATION

       All supported links load inside the current proxy tab.
    */

    frame.addEventListener("load", () => {

        try {

            const pageDocument = frame.contentDocument;

            if (!pageDocument) return;

            pageDocument.addEventListener("click", event => {

                const target = event.target;

                const link = target && typeof target.closest === "function"
                    ? target.closest("a")
                    : null;

                if (!link) return;

                event.preventDefault();
                event.stopPropagation();
                event.stopImmediatePropagation();

                const tab = tabs.find(item => item.frame === frame);

                if (!tab || !tab.url) return;

                try {

                    const destination = new URL(
                        link.href,
                        tab.url
                    );

                    if (destination.protocol !== "https:") {
                        tab.error = "Only HTTPS websites are supported.";

                        if (tab.id === activeTabId) {
                            updateActiveView();
                        }

                        return;
                    }

                    loadURL(tab, destination.href, true);

                } catch (error) {

                    tab.error = "Invalid link.";

                    if (tab.id === activeTabId) {
                        updateActiveView();
                    }
                }

            }, true);

        } catch(error) {
            // Ignore inaccessible frame documents.
        }

    });

    document.getElementById("viewerContainer").appendChild(frame);

    const tab = {
        id,
        title: "New Tab",
        url: "",
        html: "",
        history: [],
        historyIndex: -1,
        loading: false,
        error: "",
        requestId: 0,
        frame
    };

    tabs.push(tab);

    switchTab(id);
    renderTabs();

    return tab;
}

function switchTab(id) {
    activeTabId = id;

    const tab = getActiveTab();

    if (!tab) return;

    tabs.forEach(t => {
        t.frame.style.display =
            t.id === id && t.html ? "block" : "none";
    });

    document.getElementById("address").value =
        tab.url || "";

    updateActiveView();
    renderTabs();
}

function renderTabs() {
    const tabList = document.getElementById("tabList");

    tabList.innerHTML = "";

    tabs.forEach(tab => {

        const tabElement = document.createElement("div");

        tabElement.className =
            "tab" + (tab.id === activeTabId ? " active" : "");

        const title = document.createElement("span");
        title.className = "tab-title";
        title.textContent = tab.title;

        const close = document.createElement("button");
        close.className = "tab-close";
        close.textContent = "×";

        close.onclick = event => {
            event.stopPropagation();
            closeTab(tab.id);
        };

        tabElement.appendChild(title);
        tabElement.appendChild(close);

        tabElement.onclick = () => switchTab(tab.id);

        tabList.appendChild(tabElement);
    });
}

function closeTab(id) {
    const index = tabs.findIndex(tab => tab.id === id);

    if (index === -1) return;

    tabs[index].frame.remove();
    tabs.splice(index, 1);

    if (activeTabId === id) {

        if (tabs.length) {
            switchTab(tabs[Math.max(0, index - 1)].id);
        } else {
            activeTabId = null;
            document.getElementById("address").value = "";
            document.getElementById("viewerContainer").innerHTML = "";
            document.getElementById("homepage").style.display = "flex";
        }
    }

    renderTabs();
}

/* FIXED: SHOW THE HOMEPAGE WHEN THE ACTIVE TAB IS EMPTY */

function updateActiveView() {
    const tab = getActiveTab();

    if (!tab || !tab.html) {
        document.getElementById("homepage").style.display = "";
        document.getElementById("status").textContent = "";

        tabs.forEach(t => {
            t.frame.style.display = "none";
        });

        return;
    }

    document.getElementById("homepage").style.display = "none";

    tabs.forEach(t => {
        t.frame.style.display =
            t.id === activeTabId && t.html ? "block" : "none";
    });

    if (tab.error) {
        document.getElementById("status").textContent = tab.error;
        return;
    }

    document.getElementById("status").textContent =
        tab.loading ? "Loading..." : "";
}

function loadURL(tab, url, addHistory = true) {
    if (!tab) return;

    tab.url = url;
    tab.error = "";
    tab.loading = true;

    if (addHistory) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url);
        tab.historyIndex++;
    }

    if (tab.id === activeTabId) {
        document.getElementById("address").value = url;
        updateActiveView();
    }

    const requestId = ++tab.requestId;

    fetch(BACKEND + "?url=" + encodeURIComponent(url))
        .then(response => response.text())
        .then(html => {

            if (requestId !== tab.requestId) return;

            tab.html = html;
            tab.loading = false;
            tab.frame.srcdoc = html;

            if (tab.id === activeTabId) {
                updateActiveView();
            }

        })
        .catch(() => {

            if (requestId !== tab.requestId) return;

            tab.loading = false;
            tab.error = "Unable to load this website.";

            if (tab.id === activeTabId) {
                updateActiveView();
            }

        });
}

function navigate() {
    const input =
        document.getElementById("address").value.trim() ||
        document.getElementById("search").value.trim();

    if (!input) return;

    showNebula();

    let url;

    if (input.includes(".") && !input.includes(" ")) {
        url = input.startsWith("http")
            ? input
            : "https://" + input;
    } else {
        url = "https://www.bing.com/search?q=" +
            encodeURIComponent(input);
    }

    let tab = getActiveTab();

    if (!tab) {
        tab = createTab();
    }

    loadURL(tab, url);
}

function back() {
    const tab = getActiveTab();

    if (!tab || tab.historyIndex <= 0) return;

    tab.historyIndex--;
    loadURL(tab, tab.history[tab.historyIndex], false);
}

function forward() {
    const tab = getActiveTab();

    if (!tab || tab.historyIndex >= tab.history.length - 1) return;

    tab.historyIndex++;
    loadURL(tab, tab.history[tab.historyIndex], false);
}

function reload() {
    const tab = getActiveTab();

    if (!tab || !tab.url) return;

    loadURL(tab, tab.url, false);
}




/* STARS BACKGROUND */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

let mouseX = -1000;
let mouseY = -1000;

function resizeStars() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    stars = [];

    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5 + 0.3,
            speed: Math.random() * 0.8 + 0.2,
            drift: (Math.random() - 0.5) * 0.5,
            offsetX: 0,
            offsetY: 0,
            twinkle: Math.random() * Math.PI * 2,
            twinkleSpeed: Math.random() * 0.04 + 0.01
        });
    }
}

window.addEventListener("mousemove", function(event) {
    mouseX = event.clientX;
    mouseY = event.clientY;
});

window.addEventListener("mouseout", function(event) {
    if (!event.relatedTarget) {
        mouseX = -1000;
        mouseY = -1000;
    }
});

function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => {

        // Move stars away from the mouse.
        const starX = star.x + star.offsetX;
        const starY = star.y + star.offsetY;

        const dx = starX - mouseX;
        const dy = starY - mouseY;
        const distance = Math.hypot(dx, dy);

        if (distance < 130 && distance > 0) {
            const force = (130 - distance) / 130;

            star.offsetX += (dx / distance) * force * 2.5;
            star.offsetY += (dy / distance) * force * 2.5;
        }

        // Smoothly return stars to their normal paths.
        star.offsetX *= 0.92;
        star.offsetY *= 0.92;

        // Draw twinkling stars.
        star.twinkle += star.twinkleSpeed;

        ctx.fillStyle = "white";
        ctx.globalAlpha = 0.4 + Math.sin(star.twinkle) * 0.3;

        ctx.beginPath();
        ctx.arc(
            star.x + star.offsetX,
            star.y + star.offsetY,
            star.size,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.globalAlpha = 1;

        // Fall in random patterns.
        star.y += star.speed;
        star.x += star.drift;

        // Wrap stars around the screen.
        if (star.y > canvas.height + 5) {
            star.y = -5;
            star.x = Math.random() * canvas.width;
        }

        if (star.x < -5) {
            star.x = canvas.width + 5;
        }

        if (star.x > canvas.width + 5) {
            star.x = -5;
        }

    });

    requestAnimationFrame(drawStars);
}

window.addEventListener("resize", resizeStars);

resizeStars();
drawStars();

/* NEBULA GAME TABS */

/* GAMES PAGE OPENS IN ITS OWN NEBULA TAB */

function openGamesTab() {
    const tab = createTab();

    tab.title = "Games";
    tab.url = "nebula://games";
    tab.html = gamesPageHTML;

    // Listen before loading srcdoc so the first load is not missed.
    tab.frame.addEventListener("load", function onGamesPageLoad() {
        let pageDocument;

        try {
            pageDocument = tab.frame.contentDocument;
        } catch (error) {
            return;
        }

        if (!pageDocument || pageDocument.documentElement.dataset.gamesReady) {
            return;
        }

        pageDocument.documentElement.dataset.gamesReady = "true";

        // One delegated handler covers all 30 placeholders.
        pageDocument.addEventListener("click", function(event) {
            const card = event.target.closest(".game-card");
            if (!card) return;

            const gameURL = card.dataset.gameUrl;
            const gameName = card.querySelector("span")?.textContent || "Game";

            if (!gameURL) return;

            openGameInNebulaTab(gameURL, gameName);
        });
    });

    tab.frame.srcdoc = gamesPageHTML;

    // Re-select after setting the tab data so the first load is not missed.
    switchTab(tab.id);
    document.getElementById("address").value = "nebula://games";
    renderTabs();
}


/* OPEN A GAME IN A NEW NEBULA TAB */

function openGameInNebulaTab(gameURL, gameName) {
    const gameTab = createTab();

    gameTab.title = gameName;
    gameTab.url = "nebula://games";
    gameTab.gameURL = gameURL;
    gameTab.html = "game";

    // Load the actual game in this Nebula tab's iframe.
    gameTab.frame.src = gameURL;

    // Re-select after setting the tab data. The URL bar stays nebula://games.
    switchTab(gameTab.id);
    document.getElementById("address").value = "nebula://games";
    renderTabs();
}

gamesButton.addEventListener("click", openGamesTab);
