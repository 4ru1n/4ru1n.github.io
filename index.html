
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070810;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* CONSTELLATION BACKGROUND */

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* BROWSER */

.browser {
    position: relative;
    z-index: 10;
}

.tab-bar {
    height: 45px;
    background: #11121b;
    display: flex;
    align-items: flex-end;
    padding: 5px 10px 0;
    gap: 7px;
}

.tabs {
    display: flex;
    align-items: flex-end;
    height: 100%;
    gap: 5px;
    flex: 1;
    overflow-x: auto;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    height: 35px;
    min-width: 130px;
    max-width: 220px;
    flex: 1;
    background: #1b1c28;
    border-radius: 9px 9px 0 0;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    color: #aaa;
    cursor: pointer;
    font-size: 12px;
}

.tab.active {
    background: #070810;
    color: white;
}

.tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.tab-close {
    background: transparent;
    border: none;
    color: #999;
    font-size: 18px;
    cursor: pointer;
}

.tab-close:hover {
    color: white;
}

.add-tab {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.add-tab:hover {
    background: #292a39;
}

/* NAVIGATION */

.navigation {
    height: 43px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 13px;
    background: #080910;
    border-bottom: 1px solid #242532;
}

.nav-button {
    background: transparent;
    border: none;
    color: #999;
    font-size: 22px;
    cursor: pointer;
}

.nav-button:hover {
    color: white;
}

.address {
    flex: 1;
    height: 30px;
    border-radius: 20px;
    background: #191a26;
    border: 1px solid #303143;
    color: white;
    padding: 0 14px;
    outline: none;
    font-size: 12px;
}

.address:focus {
    border-color: #8585bd;
}

/* MAIN */

main {
    position: absolute;
    top: 88px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
}

/* HOMEPAGE */

.homepage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 50px;
    background: transparent;
}

.logo {
    font-size: 68px;
    font-weight: 700;
    letter-spacing: -3px;
    color: white;
    margin-bottom: 30px;
    user-select: none;
    text-shadow: 0 0 35px rgba(150,150,255,0.15);
}

/* SEARCH BOX */

.search-box {
    width: min(550px, 85%);
    height: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    border-radius: 16px;
    background: rgba(24,25,38,0.88);
    border: 1px solid #48495d;
    backdrop-filter: blur(12px);
    transition: 0.2s;
}

.search-box:focus-within {
    border-color: #9999d5;
    box-shadow: 0 0 25px rgba(130,130,255,0.13);
}

.search-icon {
    display: flex;
    color: #c4c4d2;
}

.search-input {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
}

.search-input::placeholder {
    color: #c0c0cc;
    opacity: 1;
}

/* WEBSITE FRAME */

.page-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
    display: none;
}

.page-frame.active {
    display: block;
}

/* LOADING AND ERROR MESSAGE */

.page-status {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(7,8,16,0.96);
    text-align: center;
    padding: 25px;
}

.page-status.visible {
    display: flex;
}

.status-title {
    font-size: 22px;
    font-weight: bold;
}

.status-message {
    color: #aaaabd;
    font-size: 13px;
    max-width: 400px;
    line-height: 1.6;
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #303143;
    border-top-color: #aaaaff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media(max-width: 600px) {
    .logo {
        font-size: 55px;
    }

    .search-box {
        width: 90%;
    }

    .tab {
        min-width: 110px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="browser">

    <div class="tab-bar">
        <div class="tabs" id="tabs"></div>
        <button class="add-tab" onclick="newTab()">+</button>
    </div>

    <div class="navigation">
        <button class="nav-button" onclick="goBack()">‹</button>
        <button class="nav-button" onclick="goForward()">›</button>
        <button class="nav-button" onclick="reloadPage()">⟳</button>

        <input
            class="address"
            id="address"
            placeholder="Search or enter website address"
            onkeydown="if(event.key==='Enter') navigate(this.value)"
        >
    </div>

</div>

<main id="main">

    <div class="homepage" id="homepage">

        <div class="logo">Nebula</div>

        <div class="search-box">

            <span class="search-icon">
                <svg width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <circle cx="10.8" cy="10.8" r="7.2"/>
                    <path d="m16 16 5 5"/>
                </svg>
            </span>

            <input
                class="search-input"
                id="search"
                placeholder="example.com"
                autocomplete="off"
                onkeydown="if(event.key==='Enter') navigate(this.value)"
            >

        </div>

    </div>

</main>

<script>

/* =================================
   NEBULA DNS CONFIGURATION
================================= */

const DNS_API =
"https://script.google.com/a/macros/jalsd.org/s/AKfycbyplxSHAclmrP6seW0G9-6DOYVmjyfgBskkLkjJYf-Lu-IjPsLM2BRTsh0PYaM9ZxqIwQ/exec";


/* =================================
   BROWSER SYSTEM
================================= */

let tabs = [];
let activeTab = null;
let tabCounter = 0;

const tabsElement = document.getElementById("tabs");
const homepage = document.getElementById("homepage");
const address = document.getElementById("address");
const main = document.getElementById("main");

function newTab() {

    const id = tabCounter++;

    const tab = {
        id,
        title: "Nebula",
        url: "",
        pendingURL: "",
        history: [],
        historyIndex: -1,
        iframe: null,
        element: null,
        status: null,
        loading: false,
        error: false,
        requestId: 0
    };

    const iframe = document.createElement("iframe");
    iframe.className = "page-frame";
    iframe.dataset.id = id;

    main.appendChild(iframe);
    tab.iframe = iframe;

    const status = document.createElement("div");
    status.className = "page-status";

    status.innerHTML = `
        <div class="spinner"></div>
        <div class="status-title">Connecting to Nebula</div>
        <div class="status-message">
            Checking the website's DNS records...
        </div>
    `;

    main.appendChild(status);
    tab.status = status;

    const element = document.createElement("div");
    element.className = "tab";

    element.innerHTML = `
        <span style="color:#aaa">✦</span>
        <span class="tab-title">Nebula</span>
        <button class="tab-close">×</button>
    `;

    element.addEventListener("click", function(e) {

        if (e.target.classList.contains("tab-close")) {
            e.stopPropagation();
            closeTab(id);
        } else {
            switchTab(id);
        }

    });

    tabsElement.appendChild(element);
    tab.element = element;

    tabs.push(tab);

    switchTab(id);
}

function getActiveTab() {
    return tabs.find(t => t.id === activeTab);
}

function switchTab(id) {

    activeTab = id;

    tabs.forEach(tab => {

        const selected = tab.id === id;

        tab.element.classList.toggle("active", selected);

        tab.iframe.classList.toggle(
            "active",
            selected && !!tab.url
        );

        tab.status.classList.toggle(
            "visible",
            selected && (tab.loading || tab.error)
        );

    });

    const tab = getActiveTab();

    homepage.style.display =
        (!tab.url && !tab.loading && !tab.error)
        ? "flex"
        : "none";

    address.value = tab.pendingURL || tab.url || "";

    if (!tab.url && !tab.pendingURL) {
        document.getElementById("search").value = "";
    }
}

function closeTab(id) {

    const index = tabs.findIndex(t => t.id === id);

    if (index === -1) return;

    const tab = tabs[index];

    tab.requestId++;

    tab.iframe.remove();
    tab.status.remove();
    tab.element.remove();

    tabs.splice(index, 1);

    if (tabs.length === 0) {
        newTab();
    } else if (activeTab === id) {
        switchTab(tabs[Math.max(0, index - 1)].id);
    }
}


/* =================================
   URL FORMATTING
================================= */

function formatURL(value) {

    value = value.trim();

    if (!value) return null;

    // Explicit HTTP is not accepted.

    if (/^http:\/\//i.test(value)) {
        throw new Error("Please use an HTTPS website.");
    }

    // Explicit HTTPS URL.

    if (/^https:\/\//i.test(value)) {

        const url = new URL(value);

        if (url.protocol !== "https:") {
            throw new Error("Only HTTPS websites are supported.");
        }

        if (url.port && url.port !== "443") {
            throw new Error("Only standard HTTPS ports are supported.");
        }

        return url.href;
    }

    // Website address without protocol.

    if (/^[^\s]+\.[^\s]+$/.test(value)) {
        return "https://" + value;
    }

    // Otherwise search Google.

    return "https://www.google.com/search?q=" +
        encodeURIComponent(value);
}


/* =================================
   CLOUDFLARE DNS CHECK
================================= */

function checkWebsiteDNS(domain) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "nebulaDNS_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 1000000);

        const script = document.createElement("script");

        const params = new URLSearchParams({
            domain: domain,
            callback: callbackName
        });

        script.src = DNS_API + "?" + params.toString();

        let finished = false;

        function cleanup() {

            if (finished) return;

            finished = true;

            clearTimeout(timeout);

            script.remove();

            try {
                delete window[callbackName];
            } catch(e) {
                window[callbackName] = undefined;
            }

        }

        const timeout = setTimeout(() => {

            cleanup();

            reject(new Error(
                "DNS verification timed out. Please try again."
            ));

        }, 15000);

        window[callbackName] = function(result) {

            if (finished) return;

            cleanup();

            if (!result || !result.success) {

                reject(new Error(
                    result?.error || "DNS verification failed."
                ));

                return;
            }

            if (!result.safeForFetching) {

                reject(new Error(
                    "This domain did not pass the preliminary DNS safety check."
                ));

                return;
            }

            resolve(result);

        };

        script.onerror = function() {

            cleanup();

            reject(new Error(
                "Could not connect to the DNS verification service."
            ));

        };

        document.head.appendChild(script);

    });

}


/* =================================
   LOAD WEBSITE AFTER DNS CHECK
================================= */

async function checkAndLoad(tab, url, action = {}) {

    if (!tab) return;

    const requestId = ++tab.requestId;

    let parsed;

    try {
        parsed = new URL(url);
    } catch(e) {

        tab.error = true;
        tab.loading = false;

        tab.status.querySelector(".status-title").textContent =
            "Invalid website";

        tab.status.querySelector(".status-message").textContent =
            "Please enter a valid website address.";

        switchTab(tab.id);
        return;
    }

    if (parsed.protocol !== "https:") {

        tab.error = true;
        tab.loading = false;

        tab.status.querySelector(".status-title").textContent =
            "HTTPS required";

        tab.status.querySelector(".status-message").textContent =
            "Nebula only accepts HTTPS websites.";

        switchTab(tab.id);
        return;
    }

    if (parsed.port && parsed.port !== "443") {

        tab.error = true;
        tab.loading = false;

        tab.status.querySelector(".status-title").textContent =
            "Unsupported port";

        tab.status.querySelector(".status-message").textContent =
            "Only standard HTTPS ports are supported.";

        switchTab(tab.id);
        return;
    }

    const domain = parsed.hostname;

    tab.loading = true;
    tab.error = false;
    tab.pendingURL = url;

    tab.status.querySelector(".spinner").style.display = "block";

    tab.status.querySelector(".status-title").textContent =
        "Checking website";

    tab.status.querySelector(".status-message").textContent =
        "Checking " + domain + " through Cloudflare DNS...";

    switchTab(tab.id);

    try {

        // Ask Apps Script to verify the domain.

        const dnsResult = await checkWebsiteDNS(domain);

        // Ignore old requests if another navigation started.

        if (
            requestId !== tab.requestId ||
            !tabs.includes(tab)
        ) {
            return;
        }

        if (!dnsResult.safeForFetching) {
            throw new Error("DNS safety check failed.");
        }

        // DNS passed. Now attempt direct browser navigation.

        tab.loading = false;
        tab.error = false;
        tab.pendingURL = "";

        if (action.type === "push") {

            tab.history = tab.history.slice(
                0,
                tab.historyIndex + 1
            );

            tab.history.push(url);
            tab.historyIndex++;

        } else if (action.type === "move") {

            tab.historyIndex = action.index;

        }

        tab.url = url;

        tab.title = domain;

        tab.element.querySelector(".tab-title").textContent =
            domain;

        tab.iframe.src = url;

        tab.status.classList.remove("visible");

        switchTab(tab.id);

    } catch(error) {

        if (
            requestId !== tab.requestId ||
            !tabs.includes(tab)
        ) {
            return;
        }

        tab.loading = false;
        tab.error = true;
        tab.pendingURL = "";

        tab.status.querySelector(".spinner").style.display =
            "none";

        tab.status.querySelector(".status-title").textContent =
            "Unable to load website";

        tab.status.querySelector(".status-message").textContent =
            error.message || "An unexpected error occurred.";

        switchTab(tab.id);

        console.error("Nebula:", error);

    }

}


/* =================================
   NAVIGATION
================================= */

function navigate(value) {

    let url;

    try {
        url = formatURL(value);
    } catch(error) {

        const tab = getActiveTab();

        tab.error = true;
        tab.loading = false;

        tab.status.querySelector(".spinner").style.display =
            "none";

        tab.status.querySelector(".status-title").textContent =
            "Invalid address";

        tab.status.querySelector(".status-message").textContent =
            error.message;

        switchTab(tab.id);

        return;
    }

    if (!url) return;

    checkAndLoad(
        getActiveTab(),
        url,
        { type: "push" }
    );

}

function goBack() {

    const tab = getActiveTab();

    if (!tab || tab.historyIndex <= 0) return;

    const index = tab.historyIndex - 1;

    checkAndLoad(
        tab,
        tab.history[index],
        {
            type: "move",
            index: index
        }
    );

}

function goForward() {

    const tab = getActiveTab();

    if (
        !tab ||
        tab.historyIndex >= tab.history.length - 1
    ) return;

    const index = tab.historyIndex + 1;

    checkAndLoad(
        tab,
        tab.history[index],
        {
            type: "move",
            index: index
        }
    );

}

function reloadPage() {

    const tab = getActiveTab();

    if (!tab) return;

    if (tab.url) {

        checkAndLoad(
            tab,
            tab.url,
            { type: "reload" }
        );

    }

}


/* =================================
   NEBULA INFINITE CONSTELLATIONS
================================= */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;

let constellations = [];

let mouse = {
    x: -1000,
    y: -1000,
    active: false
};

const SETTINGS = {
    speed: 32,
    spawnInterval: 0.65,
    mouseRadius: 180,
    connectionDistance: 145,
    maxMouseConnections: 9
};

let spawnTimer = 0;
let lastTime = 0;


/* CANVAS RESIZING */

function resizeCanvas() {

    const ratio = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * ratio;
    canvas.height = height * ratio;

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    if (constellations.length === 0) {

        const amount = Math.ceil(width / 155);

        for (let i = 0; i < amount; i++) {

            createConstellation(
                Math.random() * width,
                Math.random() * height,
                true
            );

        }

    }

}


/* CREATE A CONSTELLATION */

function createConstellation(x, y, initial = false) {

    const starCount = Math.floor(Math.random() * 4) + 4;

    const group = {
        x: x,
        y: y,
        stars: [],
        connections: [],
        speed: SETTINGS.speed * (0.65 + Math.random() * 0.7)
    };

    for (let i = 0; i < starCount; i++) {

        group.stars.push({

            x: (Math.random() - 0.5) * 135,
            y: (Math.random() - 0.5) * 135,

            radius: Math.random() * 1.5 + 0.5,

            opacity: Math.random() * 0.6 + 0.3,

            twinkleSpeed: Math.random() * 0.8 + 0.3,

            twinkleDirection: Math.random() > 0.5 ? 1 : -1

        });

    }

    for (let i = 0; i < starCount; i++) {

        let nearest = [];

        for (let j = 0; j < starCount; j++) {

            if (i === j) continue;

            const a = group.stars[i];
            const b = group.stars[j];

            const distance = Math.hypot(
                a.x - b.x,
                a.y - b.y
            );

            if (distance < SETTINGS.connectionDistance) {

                nearest.push({
                    index: j,
                    distance: distance
                });

            }

        }

        nearest.sort((a, b) => a.distance - b.distance);

        const amount = Math.min(
            nearest.length,
            Math.random() > 0.5 ? 2 : 1
        );

        for (let j = 0; j < amount; j++) {

            const target = nearest[j].index;

            const exists = group.connections.some(connection =>
                (connection.from === i && connection.to === target) ||
                (connection.from === target && connection.to === i)
            );

            if (!exists) {

                group.connections.push({
                    from: i,
                    to: target
                });

            }

        }

    }

    constellations.push(group);

}


/* GENERATE NEW CONSTELLATIONS */

function spawnConstellation() {

    const y = Math.random() * height;

    createConstellation(
        width + 100,
        y
    );

}


/* DRAW A STAR */

function drawStar(x, y, star) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        star.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        `rgba(225,230,255,${star.opacity})`;

    ctx.shadowBlur = 9;
    ctx.shadowColor = "#9999ff";

    ctx.fill();

    ctx.shadowBlur = 0;

}


/* DRAW CONSTELLATIONS */

function drawConstellation(group, delta) {

    group.x -= group.speed * delta;

    group.stars.forEach(star => {

        star.opacity +=
            star.twinkleSpeed * delta *
            star.twinkleDirection;

        if (star.opacity > 0.95) {

            star.opacity = 0.95;
            star.twinkleDirection = -1;

        }

        if (star.opacity < 0.2) {

            star.opacity = 0.2;
            star.twinkleDirection = 1;

        }

    });

    group.connections.forEach(connection => {

        const a = group.stars[connection.from];
        const b = group.stars[connection.to];

        const ax = group.x + a.x;
        const ay = group.y + a.y;

        const bx = group.x + b.x;
        const by = group.y + b.y;

        ctx.beginPath();

        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);

        ctx.strokeStyle = "rgba(145,150,255,0.22)";
        ctx.lineWidth = 0.8;

        ctx.stroke();

    });

    group.stars.forEach(star => {

        drawStar(
            group.x + star.x,
            group.y + star.y,
            star
        );

    });

}


/* =================================
   INTERACTIVE MOUSE CONSTELLATIONS
================================= */

window.addEventListener("pointermove", function(event) {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

    mouse.active = true;

});

window.addEventListener("pointerleave", function() {

    mouse.active = false;

});


/* MOUSE CONNECTIONS */

function drawMouseConnections() {

    if (!mouse.active) return;

    let nearbyStars = [];

    constellations.forEach(group => {

        group.stars.forEach(star => {

            const x = group.x + star.x;
            const y = group.y + star.y;

            const distance = Math.hypot(
                mouse.x - x,
                mouse.y - y
            );

            if (distance < SETTINGS.mouseRadius) {

                nearbyStars.push({
                    x: x,
                    y: y,
                    distance: distance,
                    opacity: star.opacity
                });

            }

        });

    });

    nearbyStars.sort((a, b) => a.distance - b.distance);

    nearbyStars = nearbyStars.slice(
        0,
        SETTINGS.maxMouseConnections
    );

    nearbyStars.forEach(star => {

        const strength = 1 - (
            star.distance / SETTINGS.mouseRadius
        );

        ctx.beginPath();

        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(star.x, star.y);

        ctx.strokeStyle =
            `rgba(155,165,255,${strength * 0.55})`;

        ctx.lineWidth = 0.8 + strength * 0.7;

        ctx.stroke();

    });

    for (let i = 0; i < nearbyStars.length; i++) {

        for (let j = i + 1; j < nearbyStars.length; j++) {

            const a = nearbyStars[i];
            const b = nearbyStars[j];

            const distance = Math.hypot(
                a.x - b.x,
                a.y - b.y
            );

            if (distance < SETTINGS.connectionDistance) {

                const strength = 1 - (
                    distance / SETTINGS.connectionDistance
                );

                ctx.beginPath();

                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.strokeStyle =
                    `rgba(145,155,255,${strength * 0.35})`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

    if (nearbyStars.length > 0) {

        ctx.beginPath();

        ctx.arc(
            mouse.x,
            mouse.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "rgba(210,215,255,0.9)";

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#aaaaff";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* =================================
   MAIN ANIMATION LOOP
================================= */

function animateStars(timestamp) {

    requestAnimationFrame(animateStars);

    if (!lastTime) lastTime = timestamp;

    const delta = Math.min(
        (timestamp - lastTime) / 1000,
        0.05
    );

    lastTime = timestamp;

    ctx.clearRect(0, 0, width, height);

    spawnTimer += delta;

    if (spawnTimer >= SETTINGS.spawnInterval) {

        spawnTimer = 0;

        spawnConstellation();

    }

    constellations.forEach(group => {

        drawConstellation(group, delta);

    });

    constellations = constellations.filter(group => {

        return group.x > -180;

    });

    drawMouseConnections();

}


/* =================================
   START NEBULA
================================= */

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

requestAnimationFrame(animateStars);

newTab();

</script>
