<script>

/* BACKEND */

const BACKEND =
"https://script.google.com/a/macros/jalsd.org/s/AKfycbzHeApHApkpHw_RS79RBNt7acMfUR6pkvKWC9fY5B6lX4wImNOqlee3HXNDya5Rxv6prg/exec";


/* AUTHORIZED TEST SITE */

// All websites are now allowed.


/* OVERLAY SYSTEM */

const defaultOverlay = document.getElementById("defaultOverlay");

let nebulaVisible = false;

function showNebula() {
    nebulaVisible = true;
    defaultOverlay.classList.add("hidden");
}

function showDefaultOverlay() {
    nebulaVisible = false;
    defaultOverlay.classList.remove("hidden");
}

/* CTRL + Q TOGGLE */

document.addEventListener("keydown", function(event) {

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "q" &&
        !event.altKey &&
        !event.metaKey
    ) {

        event.preventDefault();
        event.stopPropagation();

        if (nebulaVisible) {
            showDefaultOverlay();
        } else {
            showNebula();
        }
    }

});

/* RETURN TO OVERLAY WHEN LEAVING NEBULA TAB */

document.addEventListener("visibilitychange", function() {

    if (document.hidden) {
        showDefaultOverlay();
    }

});

/* ALSO HANDLE WINDOW FOCUS CHANGES */

window.addEventListener("blur", function() {
    // Delay slightly to see where the focus actually landed
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === "IFRAME") {
            // If focus moved to an internal iframe, do not trigger the overlay
            return;
        }
        showDefaultOverlay();
    }, 100);
});



/* TAB SYSTEM */

let tabs = [];
let activeTabId = null;
let nextTabId = 1;

function getActiveTab() {
    return tabs.find(tab => tab.id === activeTabId);
}

function createTab() {
    const id = nextTabId++;

    const frame = document.createElement("iframe");
    frame.className = "viewer";

    /*
       LINK NAVIGATION

       All supported links load inside the current proxy tab.
    */

    frame.addEventListener("load", () => {

        try {

            const pageDocument = frame.contentDocument;

            if (!pageDocument) return;

            pageDocument.addEventListener("click", event => {

                const target = event.target;

                const link = target && typeof target.closest === "function"
                    ? target.closest("a")
                    : null;

                if (!link) return;

                event.preventDefault();
                event.stopPropagation();
                event.stopImmediatePropagation();

                const tab = tabs.find(item => item.frame === frame);

                if (!tab || !tab.url) return;

                try {

                    const destination = new URL(
                        link.href,
                        tab.url
                    );

                    if (destination.protocol !== "https:") {
                        tab.error = "Only HTTPS websites are supported.";

                        if (tab.id === activeTabId) {
                            updateActiveView();
                        }

                        return;
                    }

                    loadURL(tab, destination.href, true);

                } catch (error) {

                    tab.error = "Invalid link.";

                    if (tab.id === activeTabId) {
                        updateActiveView();
                    }
                }

            }, true);

        } catch(error) {
            // Ignore inaccessible frame documents.
        }

    });

    document.getElementById("viewerContainer").appendChild(frame);

    const tab = {
        id,
        title: "New Tab",
        url: "",
        html: "",
        history: [],
        historyIndex: -1,
        loading: false,
        error: "",
        requestId: 0,
        frame
    };

    tabs.push(tab);

    switchTab(id);
    renderTabs();

    return tab;
}

function switchTab(id) {
    activeTabId = id;

    const tab = getActiveTab();

    if (!tab) return;

    tabs.forEach(t => {
        t.frame.style.display =
            t.id === id && t.html ? "block" : "none";
    });

    document.getElementById("address").value = tab.url || "";

    document.getElementById("homepage").style.display =
        tab.html ? "none" : "flex";

    document.getElementById("status").textContent =
        tab.loading ? "Nebula is retrieving the website..." :
        tab.error ? tab.error : "";

    document.getElementById("search").value = "";

    document.title = "Desmos | Testing";

    renderTabs();
}

function closeTab(id, event) {
    if (event) event.stopPropagation();

    const index = tabs.findIndex(tab => tab.id === id);

    if (index === -1) return;

    const wasActive = activeTabId === id;

    tabs[index].frame.remove();
    tabs.splice(index, 1);

    if (tabs.length === 0) {
        createTab();
        return;
    }

    if (wasActive) {
        const next = tabs[Math.max(0, index - 1)];
        switchTab(next.id);
    }

    renderTabs();
}

function renderTabs() {
    const container = document.getElementById("tabList");

    container.innerHTML = "";

    tabs.forEach(tab => {

        const element = document.createElement("div");

        element.className =
            "tab" + (tab.id === activeTabId ? " active" : "");

        element.onclick = () => switchTab(tab.id);

        const title = document.createElement("span");
        title.className = "tab-title";
        title.textContent = tab.title;

        const close = document.createElement("button");
        close.className = "tab-close";
        close.textContent = "×";
        close.title = "Close tab";
        close.onclick = event => closeTab(tab.id, event);

        element.appendChild(title);
        element.appendChild(close);

        container.appendChild(element);
    });
}


/* URL HANDLING */

function normalizeURL(value) {

    value = value.trim();

    if (!value) {
        throw new Error("Enter a website.");
    }

    if (/^http:\/\//i.test(value)) {
        throw new Error("Please use HTTPS.");
    }

    if (!/^https:\/\//i.test(value)) {
        value = "https://" + value;
    }

    const parsed = new URL(value);

    if (parsed.protocol !== "https:") {
        throw new Error("Please use HTTPS.");
    }

    return parsed.href;
}


/* BACKEND REQUEST */

function requestPage(url) {

    return new Promise((resolve, reject) => {

        const callback =
            "nebulaCallback" + Date.now() +
            Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const params = new URLSearchParams({
            url,
            callback
        });

        const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out."));
        }, 30000);

        function cleanup() {
            clearTimeout(timeout);
            script.remove();
            delete window[callback];
        }

        window[callback] = result => {

            cleanup();

            if (!result.success) {
                reject(new Error(result.error));
            } else {
                resolve(result);
            }
        };

        script.onerror = () => {
            cleanup();
            reject(new Error("Backend connection failed."));
        };

        script.src = BACKEND + "?" + params.toString();

        document.head.appendChild(script);
    });
}


/* NAVIGATION */

async function navigate(value) {

    const tab = getActiveTab();

    if (!tab) return;

    const input = value ||
        document.getElementById("address").value ||
        document.getElementById("search").value;

    let url;

    try {
        const isWebsite = /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?([/?#].*)?$/i.test(input.trim());
        url = isWebsite
            ? normalizeURL(input)
            : "https://www.bing.com/search?q=" + encodeURIComponent(input.trim());
    } catch(error) {
        tab.error = error.message;
        updateActiveView();
        return;
    }

    await loadURL(tab, url, true);
}

async function loadURL(tab, url, addHistory) {

    const id = ++tab.requestId;

    tab.loading = true;
    tab.error = "";
    tab.html = "";

    if (tab.id === activeTabId) {
        updateActiveView();
    }

    try {

        const result = await requestPage(url);

        if (id !== tab.requestId) return;
        if (!tabs.includes(tab)) return;

        const finalURL = new URL(result.url || url);

        if (finalURL.protocol !== "https:") {
            throw new Error("Only HTTPS websites are supported.");
        }

        tab.url = finalURL.href;
        tab.title = result.title || "Nebula";
        tab.html = result.html;

        if (addHistory) {

            tab.history = tab.history.slice(
                0,
                tab.historyIndex + 1
            );

            tab.history.push(tab.url);
            tab.historyIndex++;

        } else if (tab.historyIndex >= 0) {

            tab.history[tab.historyIndex] = tab.url;
        }

        /* ISOLATED WEBSITE CONTENT */

        tab.frame.srcdoc = result.html;

        tab.loading = false;
        tab.error = "";

        renderTabs();

        if (tab.id === activeTabId) {
            updateActiveView();
        }

    } catch(error) {

        if (id !== tab.requestId) return;

        tab.loading = false;
        tab.error = "Nebula error: " + error.message;

        if (tab.id === activeTabId) {
            updateActiveView();
        }
    }
}

function updateActiveView() {

    const tab = getActiveTab();

    if (!tab) return;

    document.getElementById("address").value = tab.url || "";

    document.getElementById("homepage").style.display =
        tab.html ? "none" : "flex";

    document.getElementById("status").textContent =
        tab.loading ? "Nebula is retrieving the website..." :
        tab.error ? tab.error : "";

    tabs.forEach(t => {

        t.frame.style.display =
            t.id === activeTabId && t.html ? "block" : "none";
    });

    document.title = "Desmos | Testing";
}


/* HISTORY */

function back() {

    const tab = getActiveTab();

    if (!tab || tab.historyIndex <= 0) return;

    tab.historyIndex--;

    loadURL(
        tab,
        tab.history[tab.historyIndex],
        false
    );
}

function forward() {

    const tab = getActiveTab();

    if (
        !tab ||
        tab.historyIndex >= tab.history.length - 1
    ) return;

    tab.historyIndex++;

    loadURL(
        tab,
        tab.history[tab.historyIndex],
        false
    );
}

function reload() {

    const tab = getActiveTab();

    if (!tab || !tab.url) return;

    loadURL(tab, tab.url, false);
}


/* CONSTELLATION BACKGROUND */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

let mouse = {
    x: -1000,
    y: -1000
};

function resize() {

    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    stars = Array.from({length: 100}, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25
    }));
}

function animate() {

    ctx.clearRect(0, 0, innerWidth, innerHeight);

    stars.forEach(star => {

        star.x += star.vx;
        star.y += star.vy;

        if (star.x < 0 || star.x > innerWidth) {
            star.vx *= -1;
        }

        if (star.y < 0 || star.y > innerHeight) {
            star.vy *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);

        ctx.fillStyle = "rgba(220,225,255,.8)";
        ctx.fill();

        const distance = Math.hypot(
            mouse.x - star.x,
            mouse.y - star.y
        );

        if (distance < 160) {

            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(star.x, star.y);

            ctx.strokeStyle =
                `rgba(150,160,255,${1-distance/160})`;

            ctx.stroke();
        }
    });

    for (let i = 0; i < stars.length; i++) {

        for (let j = i + 1; j < stars.length; j++) {

            const a = stars[i];
            const b = stars[j];

            const d = Math.hypot(
                a.x - b.x,
                a.y - b.y
            );

            if (d < 105) {

                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.strokeStyle =
                    `rgba(140,150,255,${0.18*(1-d/105)})`;

                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(animate);
}


/* STARTUP */

document.title = "Desmos | Testing";

window.addEventListener("resize", resize);

window.addEventListener("pointermove", event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
});

window.addEventListener("pointerleave", () => {
    mouse.x = -1000;
    mouse.y = -1000;
});

resize();
animate();

createTab();

</script>

/* GAME IFRAME */

const gameOverlay = document.createElement("iframe");

gameOverlay.style.cssText = `
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
    display: none;
    z-index: 20;
`;

document.querySelector("main").appendChild(gameOverlay);


/* BACK BUTTON SUPPORT */

const originalNebulaBack = back;

back = function() {

    if (gameOverlay.style.display === "block") {

        gameOverlay.style.display = "none";
        gameOverlay.src = "about:blank";

        return;
    }

    originalNebulaBack();

};


/* HIDE GAME IFRAME WHEN SWITCHING TABS */

const originalNebulaSwitchTab = switchTab;

switchTab = function(id) {

    gameOverlay.style.display = "none";
    gameOverlay.src = "about:blank";

    originalNebulaSwitchTab(id);

};
