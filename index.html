
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desmos | Testing</title>
<link rel="icon" type="image/png" href="https://www.desmos.com/apple-touch-icon.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070810;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.browser {
    position: relative;
    z-index: 2;
}

/* TAB BAR */

.tabbar {
    height: 43px;
    display: flex;
    align-items: center;
    padding: 5px 10px 0;
    background: #090a12;
    border-bottom: 1px solid #242535;
    gap: 7px;
}

.tab-list {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
    min-width: 0;
}

.tab-list::-webkit-scrollbar {
    display: none;
}

.tab {
    height: 33px;
    width: 175px;
    min-width: 100px;
    max-width: 210px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 11px;
    background: #141521;
    border: 1px solid #292a3b;
    border-bottom: none;
    border-radius: 9px 9px 0 0;
    color: #999bad;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
    transition: background .15s;
}

.tab:hover {
    background: #1b1c2a;
    color: white;
}

.tab.active {
    background: #202130;
    color: white;
    border-color: #393a4d;
}

.tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.tab-close {
    border: none;
    background: transparent;
    color: #9293a5;
    font-size: 17px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tab-close:hover {
    background: #38394b;
    color: white;
}

.new-tab {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #aaa;
    font-size: 23px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.new-tab:hover {
    background: #242536;
    color: white;
}

/* NAVIGATION */

.navigation {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    background: #10111b;
    border-bottom: 1px solid #282939;
}

.nav-button {
    border: none;
    background: transparent;
    color: #bbb;
    font-size: 23px;
    cursor: pointer;
}

.nav-button:hover {
    color: white;
}

.address {
    flex: 1;
    height: 33px;
    background: #202130;
    border: 1px solid #393a4d;
    border-radius: 20px;
    color: white;
    padding: 0 15px;
    outline: none;
}

.address:focus {
    border-color: #7779c5;
}

/* PAGE CONTENT */

main {
    position: absolute;
    inset: 95px 0 0;
}

.homepage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 28px;
}

.logo {
    font-size: 70px;
    letter-spacing: -4px;
    font-weight: bold;
    text-shadow: 0 0 35px #7777bd55;
}

.search-box {
    width: min(550px, 85%);
    height: 58px;
    background: #191a28;
    border: 1px solid #48495d;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 0 18px;
}

.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
}

.viewer {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

#status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #aaa;
    text-align: center;
    width: 90%;
    z-index: 3;
    font-size: 14px;
}

@media (max-width: 600px) {
    .tab {
        width: 130px;
    }

    .navigation {
        gap: 8px;
        padding: 0 9px;
    }

    .logo {
        font-size: 55px;
    }
}

/* DEFAULT FULLSCREEN DESMOS */

#defaultFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 9999;
    background: white;
    pointer-events: none;
}

body.nebula-mode #defaultFrame {
    display: none;
}

body:not(.nebula-mode) .browser,
body:not(.nebula-mode) main,
body:not(.nebula-mode) #stars {
    visibility: hidden;
}
</style>
</head>

<body>

<iframe
    id="defaultFrame"
    src="https://www.desmos.com/testing/ohio/scientific"
    allow="fullscreen"
    tabindex="-1"
></iframe>

<canvas id="stars"></canvas>

<div class="browser">

    <!-- TABS -->
    <div class="tabbar">
        <div class="tab-list" id="tabList"></div>
        <button class="new-tab" onclick="createTab()" title="New tab">+</button>
    </div>

    <!-- NAVIGATION -->
    <div class="navigation">
        <button class="nav-button" onclick="back()" title="Back">‹</button>
        <button class="nav-button" onclick="forward()" title="Forward">›</button>
        <button class="nav-button" onclick="reload()" title="Reload">⟳</button>

        <input
            id="address"
            class="address"
            placeholder="Search or enter website"
            onkeydown="if(event.key==='Enter')navigate()"
        >
    </div>

</div>

<main>

    <section class="homepage" id="homepage">
        <div class="logo">Nebula</div>

        <div class="search-box">
            <input
                id="search"
                placeholder="Search or enter website"
                onkeydown="if(event.key==='Enter')navigate()"
            >
        </div>
    </section>

    <div id="status"></div>

    <div id="viewerContainer"></div>

</main>

<script>

/* BACKEND */

const BACKEND =
"https://script.google.com/a/macros/jalsd.org/s/AKfycbzHeApHApkpHw_RS79RBNt7acMfUR6pkvKWC9fY5B6lX4wImNOqlee3HXNDya5Rxv6prg/exec";


/* TAB SYSTEM */

let tabs = [];
let activeTabId = null;
let nextTabId = 1;

function getActiveTab() {
    return tabs.find(tab => tab.id === activeTabId);
}

function createTab() {
    const id = nextTabId++;

    const frame = document.createElement("iframe");
    frame.className = "viewer";
    frame.setAttribute("sandbox", "");
    frame.setAttribute("referrerpolicy", "no-referrer");

    document.getElementById("viewerContainer").appendChild(frame);

    const tab = {
        id,
        title: "New Tab",
        url: "",
        html: "",
        history: [],
        historyIndex: -1,
        loading: false,
        error: "",
        requestId: 0,
        frame
    };

    tabs.push(tab);

    switchTab(id);
    renderTabs();

    return tab;
}

function switchTab(id) {
    activeTabId = id;

    const tab = getActiveTab();

    if (!tab) return;

    tabs.forEach(t => {
        t.frame.style.display =
            t.id === id && t.html ? "block" : "none";
    });

    document.getElementById("address").value = tab.url || "";

    document.getElementById("homepage").style.display =
        tab.html ? "none" : "flex";

    document.getElementById("status").textContent =
        tab.loading ? "Nebula is retrieving the website..." :
        tab.error ? tab.error : "";

    document.getElementById("search").value = "";

    // Keep the actual browser tab title unchanged.
    document.title = "Desmos | Testing";

    renderTabs();
}

function closeTab(id, event) {
    if (event) event.stopPropagation();

    const index = tabs.findIndex(tab => tab.id === id);

    if (index === -1) return;

    const wasActive = activeTabId === id;

    tabs[index].frame.remove();
    tabs.splice(index, 1);

    if (tabs.length === 0) {
        createTab();
        return;
    }

    if (wasActive) {
        const next = tabs[Math.max(0, index - 1)];
        switchTab(next.id);
    }

    renderTabs();
}

function renderTabs() {
    const container = document.getElementById("tabList");

    container.innerHTML = "";

    tabs.forEach(tab => {
        const element = document.createElement("div");

        element.className =
            "tab" + (tab.id === activeTabId ? " active" : "");

        element.onclick = () => switchTab(tab.id);

        const title = document.createElement("span");
        title.className = "tab-title";
        title.textContent = tab.title;

        const close = document.createElement("button");
        close.className = "tab-close";
        close.textContent = "×";
        close.title = "Close tab";
        close.onclick = event => closeTab(tab.id, event);

        element.appendChild(title);
        element.appendChild(close);

        container.appendChild(element);
    });
}


/* URL HANDLING */

function normalizeURL(value) {
    value = value.trim();

    if (!value) {
        throw new Error("Enter a website.");
    }

    if (/^http:\/\//i.test(value)) {
        throw new Error("Please use HTTPS.");
    }

    if (!/^https:\/\//i.test(value)) {
        value = "https://" + value;
    }

    const parsed = new URL(value);

    if (!parsed.hostname || !parsed.hostname.includes(".")) {
        throw new Error("Please enter a valid website address.");
    }

    return parsed.href;
}


/* BACKEND REQUEST */

function requestPage(url) {
    return new Promise((resolve, reject) => {

        const callback =
            "nebulaCallback" + Date.now() +
            Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const params = new URLSearchParams({
            url,
            callback
        });

        const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out."));
        }, 30000);

        function cleanup() {
            clearTimeout(timeout);
            script.remove();
            delete window[callback];
        }

        window[callback] = result => {
            cleanup();

            if (!result.success) {
                reject(new Error(result.error));
            } else {
                resolve(result);
            }
        };

        script.onerror = () => {
            cleanup();
            reject(new Error("Backend connection failed."));
        };

        script.src = BACKEND + "?" + params.toString();

        document.head.appendChild(script);
    });
}


/* NAVIGATION */

async function navigate(value) {
    const tab = getActiveTab();

    if (!tab) return;

    const input = value ||
        document.getElementById("address").value ||
        document.getElementById("search").value;

    let url;

    try {
        url = normalizeURL(input);
    } catch(error) {
        tab.error = error.message;
        updateActiveView();
        return;
    }

    await loadURL(tab, url, true);
}

async function loadURL(tab, url, addHistory) {

    const id = ++tab.requestId;

    tab.loading = true;
    tab.error = "";
    tab.html = "";

    if (tab.id === activeTabId) {
        updateActiveView();
    }

    try {
        const result = await requestPage(url);

        if (id !== tab.requestId) return;

        if (!tabs.includes(tab)) return;

        tab.url = result.url;
        tab.title = result.title || "Nebula";
        tab.html = result.html;

        if (addHistory) {
            tab.history = tab.history.slice(
                0,
                tab.historyIndex + 1
            );

            tab.history.push(tab.url);
            tab.historyIndex++;
        } else if (tab.historyIndex >= 0) {
            tab.history[tab.historyIndex] = tab.url;
        }

        tab.frame.srcdoc = result.html;

        tab.loading = false;
        tab.error = "";

        renderTabs();

        if (tab.id === activeTabId) {
            updateActiveView();
        }

    } catch(error) {

        if (id !== tab.requestId) return;

        tab.loading = false;
        tab.error = "Nebula error: " + error.message;

        if (tab.id === activeTabId) {
            updateActiveView();
        }
    }
}

function updateActiveView() {
    const tab = getActiveTab();

    if (!tab) return;

    document.getElementById("address").value = tab.url || "";

    document.getElementById("homepage").style.display =
        tab.html ? "none" : "flex";

    document.getElementById("status").textContent =
        tab.loading ? "Nebula is retrieving the website..." :
        tab.error ? tab.error : "";

    tabs.forEach(t => {
        t.frame.style.display =
            t.id === activeTabId && t.html ? "block" : "none";
    });

    // Never allow a proxied website to change the browser tab title.
    document.title = "Desmos | Testing";
}


/* HISTORY */

function back() {
    const tab = getActiveTab();

    if (!tab || tab.historyIndex <= 0) return;

    tab.historyIndex--;

    loadURL(
        tab,
        tab.history[tab.historyIndex],
        false
    );
}

function forward() {
    const tab = getActiveTab();

    if (
        !tab ||
        tab.historyIndex >= tab.history.length - 1
    ) return;

    tab.historyIndex++;

    loadURL(
        tab,
        tab.history[tab.historyIndex],
        false
    );
}

function reload() {
    const tab = getActiveTab();

    if (!tab || !tab.url) return;

    loadURL(tab, tab.url, false);
}


/* CONSTELLATION BACKGROUND */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

let mouse = {
    x: -1000,
    y: -1000
};

function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    stars = Array.from({length: 100}, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25
    }));
}

function animate() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    stars.forEach(star => {

        star.x += star.vx;
        star.y += star.vy;

        if (star.x < 0 || star.x > innerWidth) {
            star.vx *= -1;
        }

        if (star.y < 0 || star.y > innerHeight) {
            star.vy *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);

        ctx.fillStyle = "rgba(220,225,255,.8)";
        ctx.fill();

        const distance = Math.hypot(
            mouse.x - star.x,
            mouse.y - star.y
        );

        if (distance < 160) {
            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(star.x, star.y);

            ctx.strokeStyle =
                `rgba(150,160,255,${1-distance/160})`;

            ctx.stroke();
        }
    });

    for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {

            const a = stars[i];
            const b = stars[j];

            const d = Math.hypot(
                a.x - b.x,
                a.y - b.y
            );

            if (d < 105) {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.strokeStyle =
                    `rgba(140,150,255,${0.18*(1-d/105)})`;

                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(animate);
}


/* KEYBOARD TOGGLE */

let nebulaMode = false;

function returnToDesmos() {
    nebulaMode = false;

    document.body.classList.remove("nebula-mode");

    document.title = "Desmos | Testing";
}

// Ctrl + Q toggles Nebula.
window.addEventListener("keydown", event => {

    if (
        event.ctrlKey &&
        event.code === "KeyQ" &&
        !event.repeat
    ) {
        event.preventDefault();

        nebulaMode = !nebulaMode;

        document.body.classList.toggle(
            "nebula-mode",
            nebulaMode
        );
    }

}, true);


/* RETURN TO DESMOS WHEN LEAVING THE BROWSER TAB */

// When the user switches to another browser tab.
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        returnToDesmos();
    }
});

// Also return to Desmos when the browser window loses focus.
window.addEventListener("blur", () => {
    returnToDesmos();
});

// Keep the title fixed when returning.
window.addEventListener("focus", () => {
    document.title = "Desmos | Testing";
});


/* STARTUP */

document.title = "Desmos | Testing";

window.addEventListener("resize", resize);

window.addEventListener("pointermove", event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
});

window.addEventListener("pointerleave", () => {
    mouse.x = -1000;
    mouse.y = -1000;
});

resize();
animate();

createTab();

</script>

</body>
</html>
